name: Publish digiid-core

on:
  push:
    tags: ['digiid-core-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="digiid-core-v$(node -p "require('./packages/digiid-core/package.json').version")"
          [ "$GITHUB_REF_NAME" = "$expected" ] || { echo "Tag $GITHUB_REF_NAME does not match $expected"; exit 1; }
      - run: npm publish --workspace digiid-core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
