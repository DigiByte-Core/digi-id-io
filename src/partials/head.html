<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ page.url }}">
<if condition="page.redirect">
<meta http-equiv="refresh" content="0; url={{ page.redirect }}">
</if>
<if condition="page.redirect || page.noindex">
<meta name="robots" content="noindex">
</if>
<meta name="theme-color" content="#002451" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#001633" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/images/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/roboto-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/nexa-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
<script>
  (function () {
    document.documentElement.classList.add('js');
    // content-visibility placeholders give wrong offsets, so render all sections before any anchor jump.
    var cvOff = function () { document.documentElement.classList.add('cv-off'); };
    if (location.hash) cvOff();
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (nav && (nav.type === 'back_forward' || nav.type === 'reload')) cvOff();
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href*="#"]');
      if (a && a.hash && a.pathname === location.pathname) cvOff();
    }, true);
    // Hash changes not caused by a click (history, address bar) already scrolled with placeholder sizes.
    addEventListener('hashchange', function () {
      if (document.documentElement.classList.contains('cv-off')) return;
      cvOff();
      var t = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (t) t.scrollIntoView();
    });
    try {
      var stored = localStorage.getItem('theme');
      var theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Digi-ID">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ page.url }}">
<meta property="og:image" content="https://www.digi-id.io{{ page.ogImage }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@DigiByteCoin">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description }}">
<meta name="twitter:image" content="https://www.digi-id.io{{ page.ogImage }}">
