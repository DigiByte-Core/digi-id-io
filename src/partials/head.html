<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ page.url }}">
<if condition="page.redirect">
<meta http-equiv="refresh" content="0; url={{ page.redirect }}">
</if>
<if condition="page.redirect || page.noindex">
<meta name="robots" content="noindex">
</if>
<meta name="theme-color" content="#002451">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/images/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/roboto-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var theme = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Digi-ID">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ page.url }}">
<meta property="og:image" content="https://www.digi-id.io{{ page.ogImage }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@DigiByteCoin">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description }}">
<meta name="twitter:image" content="https://www.digi-id.io{{ page.ogImage }}">
